<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddeeff"/>
      <stop offset="100%" stop-color="#f0f6ff"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#ede6d8"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="100%" stop-color="#d4c8b0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2b55"/>
      <stop offset="100%" stop-color="#071828"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a878"/>
      <stop offset="100%" stop-color="#a8845a"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3d6e"/>
      <stop offset="100%" stop-color="#0d2b55"/>
    </linearGradient>
    <linearGradient id="ceilLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#fffdf5"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff8d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(220,240,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(220,240,255,0)"/>
    </radialGradient>
    <linearGradient id="plantGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a8040"/>
      <stop offset="100%" stop-color="#2d5828"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a070"/>
      <stop offset="100%" stop-color="#a07848"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="softSm">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
    <filter id="shadowSm">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- ===== BACKGROUND / ROOM ===== -->
  <!-- Ceiling -->
  <rect x="0" y="0" width="1200" height="220" fill="#f7f4ee"/>

  <!-- Back wall -->
  <polygon points="200,180 1000,180 1000,520 200,520" fill="url(#wallGrad)"/>
  <!-- Wall with perspective - left angled wall -->
  <polygon points="0,0 200,180 200,520 0,800" fill="#ede6d8"/>
  <!-- Right angled wall -->
  <polygon points="1200,0 1000,180 1000,520 1200,800" fill="#e8e0d0"/>

  <!-- Floor -->
  <polygon points="0,800 1200,800 1000,520 200,520" fill="url(#floorGrad)"/>
  <!-- Floor tiles perspective -->
  <line x1="200" y1="520" x2="0"    y2="800" stroke="rgba(0,0,0,0.07)" stroke-width="1"/>
  <line x1="350" y1="520" x2="100"  y2="800" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="500" y1="520" x2="300"  y2="800" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="650" y1="520" x2="500"  y2="800" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="800" y1="520" x2="700"  y2="800" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="950" y1="520" x2="900"  y2="800" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="1000" y1="520" x2="1100" y2="800" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <!-- Floor horizontal tile lines -->
  <line x1="175" y1="580" x2="1025" y2="580" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="145" y1="650" x2="1055" y2="650" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="100" y1="720" x2="1100" y2="720" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>

  <!-- Ceiling recessed panel -->
  <rect x="0" y="0" width="1200" height="28" fill="#f0ece4"/>
  <rect x="0" y="0" width="1200" height="6" fill="#e8e0d6"/>
  <!-- Crown molding at wall join -->
  <polygon points="200,180 1000,180 1010,170 190,170" fill="#ede8df"/>

  <!-- ===== WINDOWS (back wall) ===== -->
  <!-- Window 1 (left of center) -->
  <rect x="270" y="208" width="170" height="220" rx="3" fill="url(#sky)" filter="url(#shadow)"/>
  <rect x="272" y="210" width="166" height="216" rx="2" fill="url(#sky)"/>
  <!-- Window light glow -->
  <rect x="270" y="208" width="170" height="220" fill="url(#windowLight)"/>
  <!-- Window frame -->
  <rect x="268" y="206" width="174" height="224" rx="3" fill="none" stroke="#c8c0b0" stroke-width="4"/>
  <!-- Window cross bar -->
  <line x1="355" y1="208" x2="355" y2="428" stroke="#c8c0b0" stroke-width="3"/>
  <line x1="270" y1="315" x2="440" y2="315" stroke="#c8c0b0" stroke-width="3"/>
  <!-- Window sill -->
  <rect x="264" y="428" width="182" height="10" rx="2" fill="#d8d0c0"/>

  <!-- Window 2 (right of center) -->
  <rect x="760" y="208" width="170" height="220" rx="3" fill="url(#sky)" filter="url(#shadow)"/>
  <rect x="762" y="210" width="166" height="216" rx="2" fill="url(#sky)"/>
  <rect x="762" y="210" width="166" height="216" fill="url(#windowLight)"/>
  <rect x="758" y="206" width="174" height="224" rx="3" fill="none" stroke="#c8c0b0" stroke-width="4"/>
  <line x1="845" y1="208" x2="845" y2="428" stroke="#c8c0b0" stroke-width="3"/>
  <line x1="760" y1="315" x2="930" y2="315" stroke="#c8c0b0" stroke-width="3"/>
  <rect x="756" y="428" width="182" height="10" rx="2" fill="#d8d0c0"/>

  <!-- ===== WALL ART / LOGO (center of back wall) ===== -->
  <rect x="520" y="215" width="160" height="140" rx="8" fill="white" filter="url(#shadow)" opacity="0.95"/>
  <!-- Tooth logo in frame -->
  <path d="M 600 240 C 580 240, 568 252, 568 268 C 568 278, 573 285, 573 295 C 573 315, 585 330, 600 330 C 615 330, 627 315, 627 295 C 627 285, 632 278, 632 268 C 632 252, 620 240, 600 240 Z"
        fill="#0d2b55" opacity="0.85"/>
  <path d="M 590 248 C 582 250, 578 258, 580 266" stroke="white" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
  <!-- Practice name under logo -->
  <text x="600" y="348" font-family="Georgia, serif" font-size="12" fill="#0d2b55" text-anchor="middle" font-weight="bold" letter-spacing="1">ORDONEZ</text>
  <text x="600" y="363" font-family="Arial, sans-serif" font-size="8.5" fill="#888877" text-anchor="middle" letter-spacing="1.5">DENTAL CARE</text>

  <!-- Wainscoting on back wall -->
  <rect x="200" y="430" width="800" height="90" fill="#e8e2d5"/>
  <line x1="200" y1="432" x2="1000" y2="432" stroke="#d0c8b8" stroke-width="1.5"/>
  <line x1="200" y1="518" x2="1000" y2="518" stroke="#d0c8b8" stroke-width="1.5"/>

  <!-- Baseboard -->
  <polygon points="200,518 1000,518 1000,524 200,524" fill="#c8c0b0"/>

  <!-- ===== CEILING LIGHTS ===== -->
  <!-- Light 1 -->
  <ellipse cx="380" cy="18" rx="55" ry="10" fill="#f5f0e8"/>
  <rect x="340" y="14" width="80" height="12" rx="3" fill="#f8f4ee"/>
  <ellipse cx="380" cy="26" rx="55" ry="8" fill="#fff5d8"/>
  <ellipse cx="380" cy="100" rx="90" ry="80" fill="url(#lampGlow)" opacity="0.5" filter="url(#soft)"/>
  <!-- Light 2 -->
  <ellipse cx="820" cy="18" rx="55" ry="10" fill="#f5f0e8"/>
  <rect x="780" y="14" width="80" height="12" rx="3" fill="#f8f4ee"/>
  <ellipse cx="820" cy="26" rx="55" ry="8" fill="#fff5d8"/>
  <ellipse cx="820" cy="100" rx="90" ry="80" fill="url(#lampGlow)" opacity="0.5" filter="url(#soft)"/>

  <!-- ===== RECEPTION DESK ===== -->
  <!-- Desk main body -->
  <rect x="560" y="440" width="380" height="180" rx="6" fill="url(#deskGrad)" filter="url(#shadow)"/>
  <!-- Desk top surface -->
  <rect x="550" y="434" width="398" height="22" rx="4" fill="url(#deskTop)"/>
  <!-- Desk front panel detail (navy with gold trim) -->
  <rect x="562" y="448" width="376" height="4" fill="#b8966a" opacity="0.5"/>
  <!-- Desk gold logo panel -->
  <rect x="648" y="475" width="200" height="65" rx="4" fill="rgba(184,150,106,0.12)"/>
  <rect x="648" y="475" width="200" height="65" rx="4" fill="none" stroke="#b8966a" stroke-width="1" opacity="0.5"/>
  <text x="748" y="504" font-family="Georgia, serif" font-size="12" fill="#c9a878" text-anchor="middle" letter-spacing="1.5">ORDONEZ</text>
  <text x="748" y="522" font-family="Arial, sans-serif" font-size="9" fill="#b8966a" text-anchor="middle" letter-spacing="2">DENTAL CARE</text>

  <!-- Computer monitor on desk -->
  <rect x="870" y="368" width="120" height="78" rx="5" fill="#1a1a2e" filter="url(#shadowSm)"/>
  <rect x="874" y="372" width="112" height="68" rx="3" fill="#0a2540"/>
  <!-- Screen content (calendar/schedule) -->
  <rect x="877" y="375" width="106" height="12" rx="1" fill="#0d2b55"/>
  <text x="930" y="384" font-family="Arial, sans-serif" font-size="7" fill="#b8966a" text-anchor="middle">APPOINTMENTS</text>
  <rect x="878" y="391" width="46" height="6" rx="1" fill="#b8966a" opacity="0.4"/>
  <rect x="878" y="400" width="36" height="6" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="878" y="409" width="50" height="6" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="878" y="418" width="40" height="6" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="932" y="391" width="46" height="6" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="932" y="400" width="36" height="6" rx="1" fill="rgba(255,255,255,0.2)"/>
  <!-- Monitor stand -->
  <rect x="922" y="446" width="12" height="20" rx="2" fill="#282838"/>
  <rect x="908" y="464" width="40" height="6" rx="2" fill="#1a1a2e"/>

  <!-- Desk phone -->
  <rect x="572" y="440" width="68" height="42" rx="4" fill="#1e2a3a" filter="url(#shadowSm)"/>
  <rect x="575" y="443" width="62" height="24" rx="2" fill="#0d1e30"/>
  <circle cx="583" cy="468" r="4" fill="#304050"/>
  <circle cx="596" cy="468" r="4" fill="#304050"/>
  <circle cx="609" cy="468" r="4" fill="#304050"/>
  <circle cx="622" cy="468" r="4" fill="#304050"/>

  <!-- Desk person (receptionist silhouette, partially visible) -->
  <ellipse cx="762" cy="415" rx="28" ry="30" fill="#d4956a"/>
  <path d="M 734 415 Q 730 440, 732 455 Q 740 460, 762 462 Q 784 460, 792 455 Q 794 440, 790 415" fill="#2d5080"/>
  <!-- Hair -->
  <ellipse cx="762" cy="395" rx="30" ry="22" fill="#1a0e08"/>
  <path d="M 732 410 Q 730 390, 762 384 Q 794 390, 792 410 L 790 398 Q 788 384, 762 380 Q 736 384, 734 398 Z" fill="#1a0e08"/>

  <!-- ===== WAITING CHAIRS (left side) ===== -->
  <!-- Chair 1 -->
  <rect x="78" y="470" width="100" height="12" rx="3" fill="#0d2b55" filter="url(#shadowSm)"/>
  <rect x="85" y="400" width="86" height="78" rx="8" fill="url(#chairGrad)" filter="url(#shadowSm)"/>
  <rect x="78" y="468" width="100" height="16" rx="4" fill="#1a3d6e"/>
  <!-- Chair back -->
  <rect x="88" y="360" width="80" height="52" rx="8" fill="url(#chairGrad)"/>
  <!-- Chair armrest left -->
  <rect x="78" y="420" width="14" height="58" rx="4" fill="#0a2040"/>
  <!-- Chair armrest right -->
  <rect x="144" y="420" width="14" height="58" rx="4" fill="#0a2040"/>
  <!-- Chair legs -->
  <rect x="88"  y="478" width="8" height="28" rx="2" fill="#0a1e30"/>
  <rect x="140" y="478" width="8" height="28" rx="2" fill="#0a1e30"/>
  <!-- Chair cushion texture -->
  <rect x="86" y="402" width="84" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="86" y="416" width="84" height="6" rx="3" fill="rgba(255,255,255,0.04)"/>
  <rect x="86" y="430" width="84" height="6" rx="3" fill="rgba(255,255,255,0.04)"/>

  <!-- Chair 2 -->
  <rect x="228" y="460" width="100" height="12" rx="3" fill="#0d2b55" filter="url(#shadowSm)"/>
  <rect x="235" y="395" width="86" height="72" rx="8" fill="url(#chairGrad)" filter="url(#shadowSm)"/>
  <rect x="228" y="458" width="100" height="16" rx="4" fill="#1a3d6e"/>
  <rect x="238" y="358" width="80" height="48" rx="8" fill="url(#chairGrad)"/>
  <rect x="228" y="412" width="14" height="56" rx="4" fill="#0a2040"/>
  <rect x="294" y="412" width="14" height="56" rx="4" fill="#0a2040"/>
  <rect x="238" y="470" width="8" height="26" rx="2" fill="#0a1e30"/>
  <rect x="290" y="470" width="8" height="26" rx="2" fill="#0a1e30"/>

  <!-- Small side table between chairs -->
  <rect x="180" y="448" width="52" height="8" rx="3" fill="#c9a878" filter="url(#shadowSm)"/>
  <rect x="195" y="456" width="22" height="36" rx="2" fill="#a8845a"/>
  <!-- Magazine on table -->
  <rect x="182" y="440" width="48" height="10" rx="2" fill="white"/>
  <rect x="182" y="440" width="48" height="4" rx="2" fill="#0d2b55"/>
  <text x="206" y="447" font-family="Arial, sans-serif" font-size="5" fill="white" text-anchor="middle">HEALTH</text>

  <!-- ===== LARGE PLANT (left corner) ===== -->
  <!-- Pot -->
  <path d="M 28 620 L 48 780 L 118 780 L 138 620 Z" fill="url(#potGrad)"/>
  <ellipse cx="83" cy="622" rx="56" ry="12" fill="#d8a878"/>
  <!-- Soil -->
  <ellipse cx="83" cy="618" rx="52" ry="10" fill="#3d2810"/>
  <!-- Plant leaves -->
  <!-- Back leaves -->
  <path d="M 83 618 Q 20 480, 50 380" stroke="#3a7030" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M 83 618 Q 140 460, 120 350" stroke="#3a7030" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M 83 618 Q 83 480, 60 380" stroke="#4a8040" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Front leaves -->
  <path d="M 83 618 Q 30 510, 15 430" stroke="#52903a" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M 83 618 Q 155 500, 175 400" stroke="#4a8840" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M 83 618 Q 88 530, 75 450" stroke="#5a9840" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- Leaf highlights -->
  <path d="M 50 382 Q 65 500, 83 618" stroke="#70b858" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 120 352 Q 102 485, 83 618" stroke="#68a850" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- ===== SMALL PLANT (right side desk area) ===== -->
  <rect x="1118" y="730" width="48" height="56" rx="4" fill="url(#potGrad)"/>
  <ellipse cx="1142" cy="732" rx="26" ry="8" fill="#d8a878"/>
  <ellipse cx="1142" cy="728" rx="24" ry="7" fill="#3d2810"/>
  <path d="M 1142 728 Q 1115 660, 1120 590" stroke="#4a8040" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 1142 728 Q 1168 650, 1160 570" stroke="#4a8040" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 1142 728 Q 1142 640, 1130 575" stroke="#52903a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 1142 728 Q 1105 670, 1095 615" stroke="#4a8848" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 1142 728 Q 1178 660, 1185 600" stroke="#4a8848" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- ===== FLOOR MAT at entrance ===== -->
  <ellipse cx="600" cy="778" rx="280" ry="22" fill="#0d2b55" opacity="0.45" filter="url(#soft)"/>
  <rect x="340" y="758" width="520" height="40" rx="4" fill="#0d2b55" opacity="0.85"/>
  <rect x="344" y="762" width="512" height="32" rx="3" fill="#1a3d6e" opacity="0.5"/>
  <text x="600" y="782" font-family="Georgia, serif" font-size="11" fill="#c9a878" text-anchor="middle" letter-spacing="2.5">WELCOME</text>

  <!-- ===== AMBIENT FLOOR SHADOW under furniture ===== -->
  <ellipse cx="138" cy="500" rx="105" ry="14" fill="rgba(0,0,0,0.10)" filter="url(#soft)"/>
  <ellipse cx="288" cy="490" rx="95"  ry="12" fill="rgba(0,0,0,0.08)" filter="url(#soft)"/>
  <ellipse cx="748" cy="615" rx="215" ry="18" fill="rgba(0,0,0,0.14)" filter="url(#soft)"/>

  <!-- ===== WARM LIGHT OVERLAY ===== -->
  <rect x="0" y="0" width="1200" height="800" fill="rgba(255,248,220,0.04)"/>
</svg>
